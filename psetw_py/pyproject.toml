[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "psetw-platform"
version = "0.1.0"
description = "Python-first enterprise planning intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PS-ETW Platform Team" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "bandit>=1.7.0",
  "types-python-jose>=3.5.0",
  "types-passlib>=1.7.7",
]

[project.scripts]
psetw-api = "psetw_platform.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/psetw_platform"]

[tool.pytest.ini_options]
addopts = "-q --cov=psetw_platform --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
  "UP",
  "B",
  "A",
  "C4",
  "RUF",
  "S",
]
ignore = ["S104", "S105", "S107", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []
