{% extends "base.html" %}
{% block content %}
  <section class="panel">
    <h1>Settings</h1>
    <p class="muted">Operational profile and environment information for PS-ETW Preparation Planner.</p>
    <div class="kpi-grid">
      <article class="kpi"><div class="kpi-title">Current User</div><div class="kpi-value">{{ user.display_name }}</div></article>
      <article class="kpi"><div class="kpi-title">Role</div><div class="kpi-value">{{ user.role.value }}</div></article>
      <article class="kpi"><div class="kpi-title">Active Project</div><div class="kpi-value">{{ active_project.name }}</div></article>
      <article class="kpi"><div class="kpi-title">Date</div><div class="kpi-value">{{ today }}</div></article>
    </div>
  </section>
{% endblock %}
