<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PS-ETW | Preparation Planner | {{ title }}</title>
    <link rel="stylesheet" href="/ui-static/ui.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="brand">PS-ETW</div>
        <div class="small subtitle">Preparation Planner</div>
      </div>
      <div class="small topbar-title">{{ title }}</div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <nav class="sidebar-menu">
          <a href="/ui/dashboard?project_id={{ active_project.id }}" class="{% if current_path == '/ui/dashboard' %}active{% endif %}">Dashboard</a>
          <a href="/ui/activities?project_id={{ active_project.id }}" class="{% if current_path == '/ui/activities' %}active{% endif %}">Activities</a>
          <a href="/ui/calendar?project_id={{ active_project.id }}" class="{% if current_path == '/ui/calendar' %}active{% endif %}">Calendar</a>
          <a href="/ui/delay-optimization?project_id={{ active_project.id }}" class="{% if current_path == '/ui/delay-optimization' %}active{% endif %}">Delay &amp; Optimization</a>
          <a href="/ui/engine-description?project_id={{ active_project.id }}" class="{% if current_path == '/ui/engine-description' %}active{% endif %}">Engine Description</a>
          <a href="/ui/anomaly-center?project_id={{ active_project.id }}" class="{% if current_path == '/ui/anomaly-center' %}active{% endif %}">Anomaly / Actions</a>
          <a href="/ui/project-setup?project_id={{ active_project.id }}" class="{% if current_path == '/ui/project-setup' %}active{% endif %}">Project Setup</a>
        </nav>
        <div class="sidebar-footer">
          <form method="get" action="{{ current_path }}" class="sidebar-project-form">
            <label for="project-id">Active project</label>
            <select id="project-id" name="project_id">
              {% for project in projects %}
                <option value="{{ project.id }}" {% if project.id == active_project.id %}selected{% endif %}>
                  {{ project.name }}
                </option>
              {% endfor %}
            </select>
            <button type="submit" class="primary">Switch</button>
          </form>
          <div class="role-badge">{{ user.display_name }} · {{ user.role.value }}</div>
          <form method="post" action="/ui/logout">
            <button type="submit">Logout</button>
          </form>
        </div>
      </aside>
      <main class="main">
        <div class="content-shell">
          {% if message %}
            <div class="alert">{{ message }}</div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
  </body>
</html>
