{% extends "base.html" %}
{% block title %}Edit Activity | ATLAS{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-header">
    <h2>Edit Activity</h2>
    <span class="panel-subtitle">{{ activity.activityId or 'Activity' }} — Python-rendered form</span>
  </div>
  <div class="panel-body">
    <form method="post" action="{{ url_for('activity_edit_post', activity_id=activity.activityId) }}" class="form-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
      <label class="field">Activity ID (read-only)
        <input type="text" value="{{ activity.activityId }}" disabled style="background:#f3f4f6;color:#6b7280" />
      </label>
      <label class="field">Phase<input name="phase" type="text" value="{{ activity.phase or '' }}" placeholder="Preparation / Build-Up / Validation" /></label>
      <label class="field">Activity Name<input name="activityName" type="text" value="{{ activity.activityName or '' }}" placeholder="Main activity" required /></label>
      <label class="field">Sub Activity<input name="subActivity" type="text" value="{{ activity.subActivity or '' }}" placeholder="Sub-activity" /></label>
      <label class="field">Planned Start<input name="plannedStartDate" type="date" value="{{ activity.plannedStartDate or '' }}" /></label>
      <label class="field">Planned End<input name="plannedEndDate" type="date" value="{{ activity.plannedEndDate or '' }}" /></label>
      <label class="field">Base Effort (hrs)<input name="baseEffortHours" type="number" min="0" step="0.5" value="{{ activity.baseEffortHours|default(0) }}" /></label>
      <label class="field">Required Materials<input name="requiredMaterials" type="text" value="{{ activity.requiredMaterials or '' }}" placeholder="Comma-separated" /></label>
      <label class="field">Required Tools<input name="requiredTools" type="text" value="{{ activity.requiredTools or '' }}" placeholder="Comma-separated" /></label>
      <label class="field">Priority
        <select name="priority">
          <option value="Low" {% if activity.priority == 'Low' %}selected{% endif %}>Low</option>
          <option value="Medium" {% if activity.priority == 'Medium' or not activity.priority %}selected{% endif %}>Medium</option>
          <option value="High" {% if activity.priority == 'High' %}selected{% endif %}>High</option>
          <option value="Critical" {% if activity.priority == 'Critical' %}selected{% endif %}>Critical</option>
        </select>
      </label>
      <label class="field">Status
        <select name="activityStatus">
          <option value="Not Started" {% if activity.activityStatus == 'Not Started' %}selected{% endif %}>Not Started</option>
          <option value="In Progress" {% if activity.activityStatus == 'In Progress' %}selected{% endif %}>In Progress</option>
          <option value="Blocked" {% if activity.activityStatus == 'Blocked' %}selected{% endif %}>Blocked</option>
          <option value="Delayed" {% if activity.activityStatus == 'Delayed' %}selected{% endif %}>Delayed</option>
          <option value="Completed" {% if activity.activityStatus == 'Completed' %}selected{% endif %}>Completed</option>
        </select>
      </label>
      <label class="field">Completion %<input name="completionPercentage" type="number" min="0" max="100" value="{{ activity.completionPercentage|default(0) }}" /></label>
      <label class="field">Remarks<input name="remarks" type="text" value="{{ activity.remarks or '' }}" /></label>
      <div style="grid-column:1/-1;display:flex;gap:12px">
        <button type="submit" class="btn">Save Changes</button>
        <a href="{{ url_for('activities') }}" class="ghost">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
